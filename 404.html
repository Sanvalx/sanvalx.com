<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Página no encontrada - SANVALX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="assets/img/foto%20de%20perfil%20sanvalx%20peque%C3%B1o.jpg">
  <style>
    html.js body{cursor:none}
    #C,#F{position:fixed;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);z-index:9999;opacity:0}
    html.js #C,html.js #F{opacity:1}
    #C{width:8px;height:8px;background:#c8f04a;transition:width .15s,height .15s,opacity .2s}
    #F{width:36px;height:36px;border:1px solid rgba(200,240,74,.35);z-index:9998;transition:width .22s,height .22s}
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      background:#060606;
      color:#f0ede6;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    h1{
      font-size:40px;
      margin-bottom:10px;
    }
    p{
      color:#888;
      margin-bottom:24px;
    }
    a{
      color:#060606;
      background:#c8f04a;
      padding:10px 22px;
      border-radius:999px;
      text-decoration:none;
      font-weight:600;
      font-size:14px;
    }
  </style>
</head>
<body>
  <div id="C"></div>
  <div id="F"></div>
  <h1>404</h1>
  <p>La página que buscas no existe.</p>
  <a href="/">Volver al inicio</a>
  <script>
    document.documentElement.classList.add('js');
    var C = document.getElementById('C');
    var F = document.getElementById('F');
    if (C && F) {
      var mx = window.innerWidth / 2, my = window.innerHeight / 2, fx = mx, fy = my;
      document.addEventListener('mousemove', function(e) {
        mx = e.clientX; my = e.clientY;
        C.style.left = mx + 'px';
        C.style.top = my + 'px';
      });
      (function loop() {
        fx += (mx - fx) * 0.1; fy += (my - fy) * 0.1;
        F.style.left = fx + 'px';
        F.style.top = fy + 'px';
        requestAnimationFrame(loop);
      })();
      document.querySelectorAll('a,button,input,select,textarea').forEach(function(el) {
        el.addEventListener('mouseenter', function() {
          C.style.width = '16px'; C.style.height = '16px';
          F.style.width = '48px'; F.style.height = '48px';
        });
        el.addEventListener('mouseleave', function() {
          C.style.width = '8px'; C.style.height = '8px';
          F.style.width = '36px'; F.style.height = '36px';
        });
      });
    }
  </script>
</body>
</html>
