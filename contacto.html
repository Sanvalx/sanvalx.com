<section class="sec" style="padding-top:150px">
  <div class="lbl">Contacto</div>
  <h1 class="ttl" style="margin-bottom:18px">Hablemos de tu <em>crecimiento</em>.</h1>
  <p style="color:#c6c6c6;max-width:620px;margin-bottom:28px">Te respondemos en menos de 24h con una propuesta clara y accionable.</p>
  <div class="form-shell">
    <form class="form-grid" action="procesar_lead.php" method="POST">
      <div style="position: absolute; left: -5000px; top: -5000px;" aria-hidden="true">
        <label for="website_url">Leave this field blank</label>
        <input type="text" id="website_url" name="website_url" tabindex="-1" autocomplete="off">
      </div>
      <div class="fg">
        <label for="nombre">Nombre <span class="req" aria-hidden="true">*</span></label>
        <input id="nombre" name="nombre" type="text" required maxlength="120" autocomplete="name" aria-required="true">
      </div>
      <div class="fg">
        <label for="email">Email <span class="req" aria-hidden="true">*</span></label>
        <input id="email" name="email" type="email" required maxlength="255" autocomplete="email" inputmode="email" aria-required="true">
      </div>
      <div class="fg">
        <label for="whatsapp">WhatsApp <span class="opt">(opcional)</span></label>
        <input id="whatsapp" name="whatsapp" type="tel" maxlength="40" autocomplete="tel" inputmode="tel" placeholder="Ej: +34 600 000 000">
      </div>
      <div class="fg">
        <label for="empresa">Empresa o emprendimiento <span class="opt">(opcional)</span></label>
        <input id="empresa" name="empresa" type="text" maxlength="255" autocomplete="organization" placeholder="Si aplica">
      </div>
      <div class="fg full">
        <label for="reto_principal">¿Qué necesitas o qué te gustaría lograr? <span class="req" aria-hidden="true">*</span></label>
        <textarea id="reto_principal" name="reto_principal" required maxlength="2500" placeholder="Cuéntanos en pocas líneas qué buscas o en qué podemos ayudarte." aria-required="true"></textarea>
      </div>
      <div class="fg full fg-check">
        <label class="fg-check-label">
          <input type="checkbox" name="privacidad" value="1" required aria-required="true">
          <span>He leído y acepto la <a href="/politicas/privacidad.html" target="_blank" rel="noopener noreferrer">política de privacidad</a>. <span class="req" aria-hidden="true">*</span></span>
        </label>
      </div>
      <div class="fg full">
        <button class="bpri" type="submit">Solicitar diagnóstico</button>
      </div>
    </form>
  </div>
